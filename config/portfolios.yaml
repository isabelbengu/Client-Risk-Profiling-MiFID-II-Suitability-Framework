# =============================================================================
# Model portfolio universe and product-side constraints
# -----------------------------------------------------------------------------
# The product side of the assessment. ESMA GL7 (paras 71-75) requires firms to
# understand the nature, features, costs and risks of what they recommend,
# including sustainability factors, before matching. GL9 (paras 91-95) requires
# a thorough assessment of alternatives on cost and complexity. GL8 para 89
# requires diversification and concentration control.
#
# Every model portfolio therefore carries, explicitly:
#   risk_band          - the client band it is suitable for
#   sri                - PRIIPs summary risk indicator (1-7)
#   stress_loss_pct    - plausible loss over 12 months in an adverse scenario
#   min_horizon_years  - recommended minimum holding period
#   complexity_tier    - the knowledge tier a client must reach to be eligible
#   liquidity          - dealing frequency of the underlying holdings
#   total_cost_bps     - ongoing costs and charges, Art. 24(4) MiFID II basis
#   sustainability     - the Art. 2(7) profile of the variant
# =============================================================================

meta:
  id: crp-portfolios
  version: "1.0.0"
  currency: EUR
  cost_basis: "ongoing costs and charges per Art. 24(4) MiFID II, ex ante, bps p.a."
  review: "quarterly by the Investment Committee; ad hoc on material change (ESMA GL7 para 75)"

# -----------------------------------------------------------------------------
# Band definitions - the client-facing meaning of each risk band
# -----------------------------------------------------------------------------
risk_bands:
  0:
    label: "No investment portfolio suitable"
    description: >-
      The client cannot absorb any permanent loss of the amount concerned, or a
      blocking control is unresolved. No model portfolio may be recommended.
      Art. 54(8) DR 2017/565 applies where the reason is missing information.
  1:
    label: "Capital preservation"
    stress_loss_pct: 3
  2:
    label: "Conservative"
    stress_loss_pct: 8
  3:
    label: "Balanced"
    stress_loss_pct: 15
  4:
    label: "Growth"
    stress_loss_pct: 28
  5:
    label: "Aggressive growth"
    stress_loss_pct: 40

# -----------------------------------------------------------------------------
# Complexity tiers - the product-side counterpart of the knowledge gate
# -----------------------------------------------------------------------------
complexity_tiers:
  0: "Deposits, money-market funds, short-dated sovereign debt"
  1: "Plain UCITS bond and multi-asset funds, investment-grade credit"
  2: "Listed equity, physically replicating index funds and ETFs"
  3: "High yield, emerging markets, structured products, synthetic replication"
  4: "Illiquid alternatives, private markets, derivatives, leverage"

# -----------------------------------------------------------------------------
