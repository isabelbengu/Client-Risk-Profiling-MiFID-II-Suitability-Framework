# -----------------------------------------------------------------------------
# Portfolio-construction constraints applied to every model
# ESMA GL8 para 89 - diversification, concentration, credit risk, own-group
# -----------------------------------------------------------------------------
construction_constraints:
  max_single_issuer_pct: 5
  max_single_issuer_pct_sovereign_ig: 25
  max_own_group_instruments_pct: 10
  min_number_of_underlying_holdings: 60
  max_illiquid_pct_by_band: {1: 0, 2: 0, 3: 5, 4: 10, 5: 15}
  small_portfolio_threshold_eur: 25000
  small_portfolio_rule: >-
    Below the threshold, effective diversification cannot be achieved through
    direct holdings; only pooled or "secured" instruments may be used
    (ESMA GL8 para 89).

# -----------------------------------------------------------------------------
# Equivalent-product selection rule
# ESMA GL9 paras 91-95; DR 2017/565 Art. 54(9)
# -----------------------------------------------------------------------------
equivalence_rule:
  definition: >-
    Two model portfolios are equivalent where they serve the same target market
    and have a comparable risk/return profile - in this framework, the same
    risk_band and the same sustainability classification.
  selection: lowest_total_cost_then_lowest_complexity
  justification_required_when: "a more costly or more complex equivalent is selected"
  justification_grounds:
    - portfolio diversification
    - liquidity
    - risk level
  record: "reason, comparator considered, decision maker, timestamp"

# -----------------------------------------------------------------------------
# Switching test
# DR 2017/565 Art. 54(11); ESMA GL10 paras 96-103
# -----------------------------------------------------------------------------
switching:
  required_inputs:
    - existing holdings, their costs and exit charges
    - proposed holdings, their entry and ongoing costs
    - expected net return over the client's remaining horizon
    - change in client circumstances or product features
  test: >-
    The firm must be reasonably able to demonstrate that the expected benefits
    of the switch are greater than its costs. Where the benefit is
    non-financial (diversification, liquidity, credit-risk reduction, alignment
    to a revised risk band) it must be stated and evidenced.
  breakeven_horizon_cap_years: 3
  rebalancing_exclusion: >-
    Rebalancing within the tolerance bands of an agreed strategy is not a
    switch. Any transaction outside those bands is (GL10 para 97).
  anti_circumvention: >-
    A sale and a related purchase advised within 30 days are assessed as one
    switch (GL10 para 100).
